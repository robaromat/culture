<title>Maquette Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : coquille d'app à 3 tailles via container queries — étroit (Fold fermé) = 1 colonne + barre du bas ;
   moyen (Fold déplié) = rail + liste + fiche ; large (ordinateur) = barre latérale avec filtres + liste + fiche. */
:root {
  --bg: #EDE5D7;        /* papier */
  --surface: #F7F2E9;   /* page claire */
  --raised: #FFFCF6;
  --ink: #2B221B;       /* encre brune */
  --muted: #776757;
  --line: #D8CBB7;
  --accent: #74303A;    /* toile de reliure bordeaux */
  --accent-ink: #FBF3EA;
  --accent-soft: #E8D3CC;
  --gold: #A9771F;
  --ok: #3F6B4A;
  --warn: #A36A12;
  --err: #A4362B;
  --shadow: 0 1px 0 rgba(60,40,20,.06), 0 8px 24px -12px rgba(60,40,20,.25);
  --proto-bg: #2B221B;
  --proto-fg: #EDE5D7;
  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19140F; --surface: #221B15; --raised: #2A221B; --ink: #EEE4D4; --muted: #A69580; --line: #3A3028;
    --accent: #D9939A; --accent-ink: #2A1316; --accent-soft: #3D262A; --gold: #DDAE58;
    --ok: #8CC09A; --warn: #E0A64A; --err: #E5867B;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    --proto-bg: #0E0B08; --proto-fg: #D8CBB7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #19140F; --surface: #221B15; --raised: #2A221B; --ink: #EEE4D4; --muted: #A69580; --line: #3A3028;
  --accent: #D9939A; --accent-ink: #2A1316; --accent-soft: #3D262A; --gold: #DDAE58;
  --ok: #8CC09A; --warn: #E0A64A; --err: #E5867B;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  --proto-bg: #0E0B08; --proto-fg: #D8CBB7;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--proto-bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barre de maquette ---------- */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--proto-bg); color: var(--proto-fg); font-size: 12.5px; }
.proto b { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .01em; }
.proto .note { opacity: .7; }
.proto .ctrls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.proto label { display: flex; align-items: center; gap: 6px; }
.proto select { background: transparent; border: 1px solid color-mix(in srgb, var(--proto-fg) 30%, transparent); border-radius: 8px; padding: 3px 6px; color: var(--proto-fg); }
.proto select option { color: #222; background: #fff; }
.proto .fmt { display: none; }
@media (min-width: 760px) { .proto .fmt { display: flex; } }

.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
.device { width: 100%; height: 100%; }
.stage.framed { padding: 20px 16px 40px; }
.stage.framed .device { flex: none; width: var(--w); height: var(--h); max-width: 100%; border-radius: 26px; overflow: hidden; border: 7px solid #0b0907; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }

/* ---------- App ---------- */
.app { container: app / inline-size; height: 100%; position: relative; overflow: hidden; background: var(--bg); }
.shell { display: grid; height: 100%; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; grid-template-areas: "main" "nav"; }
.main { grid-area: main; min-height: 0; position: relative; }
.nav { grid-area: nav; }

/* Barre de navigation */
.nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav .brand, .nav .navfilters { display: none; }
.nav .items { display: flex; flex: 1; justify-content: space-around; align-items: center; }
.navbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px; border-radius: 12px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.navbtn[aria-current="page"] { color: var(--accent); }
.navbtn.add { color: var(--accent-ink); background: var(--accent); border-radius: 999px; width: 52px; height: 52px; justify-content: center; padding: 0; margin-top: -22px; box-shadow: var(--shadow); }
.navbtn.add span { display: none; }
.navbtn.add svg { width: 26px; height: 26px; }

/* En-têtes */
.head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.wordmark { font-family: var(--f-display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; line-height: 1; }
.wordmark em { font-style: italic; font-weight: 400; color: var(--accent); }
.h-title { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sync.pending .dot { background: var(--warn); animation: pulse 1.2s infinite; }
.sync.error { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
.sync.error .dot { background: var(--err); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .sync.pending .dot { animation: none; } * { transition: none !important; } }

.searchbox { margin: 6px 16px 4px; display: flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.searchbox input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; }
.searchbox svg { color: var(--muted); }

/* Pastilles */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip svg.i { width: 16px; height: 16px; }
.chip .n { font-size: 11.5px; opacity: .65; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 8px; scrollbar-width: none; align-items: center; }
.filters::-webkit-scrollbar { display: none; }
.fbtn { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--ink); border: 1px dashed var(--line); white-space: nowrap; }
.fbtn.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.fbtn svg.i { width: 15px; height: 15px; }
.viewtoggle { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.viewtoggle button { padding: 5px 8px; color: var(--muted); }
.viewtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.viewtoggle svg.i { width: 16px; height: 16px; }
.count { padding: 2px 16px 6px; font-size: 12px; color: var(--muted); letter-spacing: .02em; }

/* Couvertures générées (la vraie app affichera les images Open Library / TMDB / Spotify) */
.cover { container-type: inline-size; position: relative; aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 3px 5px 5px 3px; background: var(--c1); color: var(--c2); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 9cqw 8cqw; box-shadow: inset 4cqw 0 0 -2cqw rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.2); }
.cover.sq { aspect-ratio: 1 / 1; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.cover .ct { font-family: var(--f-display); font-weight: 600; font-size: 13cqw; line-height: 1.05; overflow-wrap: anywhere; text-wrap: balance; }
.cover .cc { font-size: 8.5cqw; opacity: .8; line-height: 1.15; }
.cover.sq .ct { font-size: 11cqw; }
.cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.14), transparent 60%); pointer-events: none; }

/* Liste */
.list { display: flex; flex-direction: column; padding: 0 8px 24px; }
.row { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 12px; align-items: start; padding: 10px 8px; border-radius: 12px; text-align: left; width: 100%; }
.row:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.row[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.row .thumb { display: flex; align-items: flex-end; height: 78px; }
.row .thumb .cover { width: 52px; }
.row .thumb .cover.sq { width: 52px; }
.r-title { font-family: var(--f-display); font-weight: 600; font-size: 16.5px; line-height: 1.2; overflow-wrap: anywhere; }
.r-meta { font-size: 13px; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
.r-line { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
.st { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.st.en_cours { color: var(--warn); }
.st.termine { color: var(--ok); }
.st.abandonne { text-decoration: line-through; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px 1px 6px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tc) 35%, transparent); white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.prov { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; color: #fff; letter-spacing: .02em; white-space: nowrap; }
.prov.netflix { background: #B1060F; }
.prov.prime { background: #0F79AF; }
.stars { display: inline-flex; gap: 1px; color: var(--gold); }
.stars svg.i { width: 13px; height: 13px; }
.stars svg.on { fill: currentColor; }

/* Grille "étagère" : les couvertures reposent sur la même ligne de base */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 18px 12px; padding: 4px 16px 24px; }
.cell { text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cell .shelf { aspect-ratio: 2 / 3; display: flex; align-items: flex-end; border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.cell .g-title { font-size: 12.5px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cell .g-meta { display: flex; gap: 4px; flex-wrap: wrap; }
.cell[aria-current="true"] .shelf { border-bottom-color: var(--accent); }

.empty { padding: 40px 24px; text-align: center; color: var(--muted); }
.empty .h-title { color: var(--ink); font-size: 20px; margin-bottom: 6px; }

/* Bibliothèque : liste + fiche */
.lib { display: grid; height: 100%; grid-template-columns: minmax(0,1fr); }
.listpane { overflow-y: auto; min-height: 0; }
.detailpane { position: absolute; inset: 0; background: var(--surface); overflow-y: auto; transform: translateX(100%); visibility: hidden; transition: transform .22s ease, visibility .22s; z-index: 5; }
.detailpane.open { transform: none; visibility: visible; }

/* Fiche détail */
.dtop { display: flex; align-items: center; gap: 6px; padding: 10px 10px 0; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; color: var(--ink); }
.iconbtn:hover { background: color-mix(in srgb, var(--line) 50%, transparent); }
.dhero { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 16px; padding: 8px 18px 4px; align-items: end; }
.dhero .cv { display: flex; align-items: flex-end; }
.eyebrow { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.eyebrow svg.i { width: 14px; height: 14px; }
.d-title { font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.08; margin: 4px 0 4px; text-wrap: balance; overflow-wrap: anywhere; }
.d-meta { color: var(--muted); font-size: 14px; }
.dbody { padding: 10px 18px 32px; display: flex; flex-direction: column; gap: 18px; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--raised); }
.seg button { padding: 8px 4px; font-size: 12.5px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14.5px; border: 1px solid var(--line); background: var(--raised); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; }
.btn.danger { color: var(--err); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.block { width: 100%; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.sect h3 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.sect p { margin: 0; }
.notes { font-family: var(--f-display); font-size: 16px; line-height: 1.5; font-style: italic; }
.avail { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--raised); display: flex; flex-direction: column; gap: 8px; }
.avail .provs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.small { font-size: 12.5px; color: var(--muted); }
.linkbtn { color: var(--accent); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.linkbtn svg.i { width: 14px; height: 14px; }
.stale { color: var(--warn); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; }
.confirm { border: 1px solid color-mix(in srgb, var(--err) 45%, var(--line)); background: color-mix(in srgb, var(--err) 7%, var(--raised)); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.placeholder { height: 100%; display: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
.placeholder .h-title { color: var(--ink); font-size: 20px; }

/* Ajout */
.page { height: 100%; overflow-y: auto; }
.pagein { max-width: 640px; margin: 0 auto; padding-bottom: 32px; }
.hint { padding: 0 16px; font-size: 12.5px; color: var(--muted); }
.results { display: flex; flex-direction: column; padding: 6px 8px; }
.res { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; text-align: left; }
.res:hover { background: var(--surface); }
.res .thumb { display: flex; align-items: flex-end; height: 72px; }
.res .thumb .cover { width: 48px; }
.res .plus { color: var(--accent); }
.reshead { padding: 8px 16px 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.detected { margin: 8px 16px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.manual { margin: 14px 16px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; }

/* Formulaire */
.form { padding: 4px 16px 110px; display: flex; flex-direction: column; gap: 18px; }
.fhero { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 14px; align-items: start; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .flabel { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.input { width: 100%; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 9px 11px; outline: none; }
.input:focus { border-color: var(--accent); }
.input.title { font-family: var(--f-display); font-weight: 600; font-size: 19px; }
textarea.input { min-height: 90px; resize: vertical; }
.fgrid { display: grid; grid-template-columns: minmax(0,1fr) 84px; gap: 8px; }
.tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
.tagpick .tag { font-size: 13px; padding: 4px 10px 4px 8px; cursor: pointer; }
.tagpick .tag[aria-pressed="false"] { background: none; border-color: var(--line); color: var(--muted); }
.tagpick .tag[aria-pressed="false"]::before { opacity: .55; }
.tagpick .new { border: 1px dashed var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--accent); font-weight: 600; }
.newtag { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; background: var(--tc); border: 2px solid transparent; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.starpick { display: flex; gap: 2px; color: var(--gold); }
.starpick button svg.i { width: 26px; height: 26px; }
.starpick button.on svg { fill: currentColor; }
details.more { border-top: 1px solid var(--line); padding-top: 12px; }
details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 6px; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary svg { transform: rotate(180deg); }
details.more .inner { display: flex; flex-direction: column; gap: 16px; padding-top: 14px; }
.savebar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 8px; z-index: 3; }
.savebar .btn.primary { flex: 1; }

/* Tags */
.tagrows { display: flex; flex-direction: column; padding: 4px 16px 24px; gap: 8px; }
.tagrow { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tagrow .top { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 14px; width: 100%; text-align: left; }
.tagrow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--tc); flex: none; }
.tagrow .nm { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tagrow .ct { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tagrow .edit { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }

/* Réglages */
.settings { padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-family: var(--f-display); font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
.card .lead { font-size: 13px; color: var(--muted); margin: -6px 0 0; }
.testres { font-size: 13px; display: flex; align-items: center; gap: 6px; }
.testres.ok { color: var(--ok); } .testres.err { color: var(--err); } .testres.wait { color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0; }
.sw-t { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--raised); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw-t[aria-checked="true"] { background: var(--accent); }
.sw-t[aria-checked="true"]::after { left: 19px; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }

/* Premier lancement */
.setup { height: 100%; overflow-y: auto; background: var(--bg); }
.setupin { max-width: 460px; margin: 0 auto; padding: 32px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.setup .big { font-family: var(--f-display); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.setup .big em { font-style: italic; font-weight: 400; color: var(--accent); }
.setup .intro { font-size: 15px; color: var(--muted); }
.steps { display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.step { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; font-size: 13.5px; }
.step::before { counter-increment: s; content: counter(s); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }

/* Feuilles (bottom sheet) */
.backdrop { position: absolute; inset: 0; background: rgba(20,14,10,.4); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 18px 18px 0 0; z-index: 21; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 80%; overflow-y: auto; box-shadow: var(--shadow); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font-family: var(--f-display); font-size: 19px; margin: 0 0 10px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; font-size: 15px; }
.opt:last-of-type { border-bottom: 0; }
.opt .ck { margin-left: auto; color: var(--accent); }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; }

/* ---------- Fold déplié : rail + liste + fiche ---------- */
@container app (min-width: 600px) {
  .shell { grid-template-columns: 84px minmax(0,1fr); grid-template-rows: minmax(0,1fr); grid-template-areas: "nav main"; }
  .nav { flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 14px 6px; }
  .nav .items { flex-direction: column; justify-content: flex-start; gap: 6px; }
  .navbtn.add { margin: 0 0 10px; order: -1; width: 52px; height: 52px; }
  .lib { grid-template-columns: minmax(0,1fr) minmax(0,1.08fr); }
  .detailpane { position: static; transform: none; visibility: visible; border-left: 1px solid var(--line); transition: none; }
  .detailpane .back { display: none; }
  .placeholder { display: flex; }
  .toast { bottom: 24px; }
  .backdrop { background: rgba(20,14,10,.35); }
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%,-50%); width: min(420px, 90%); border-radius: 16px; }
  .sheet .grab { display: none; }
  .savebar { position: sticky; }
}
/* ---------- Ordinateur : barre latérale avec filtres ---------- */
@container app (min-width: 1000px) {
  .shell { grid-template-columns: 250px minmax(0,1fr); }
  .nav { padding: 20px 14px; gap: 18px; overflow-y: auto; }
  .nav .brand { display: block; padding: 0 8px; }
  .nav .items { gap: 2px; align-items: stretch; }
  .navbtn { flex-direction: row; gap: 10px; font-size: 14.5px; padding: 9px 10px; border-radius: 10px; }
  .navbtn[aria-current="page"] { background: var(--accent-soft); }
  .navbtn.add { width: auto; height: auto; border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; justify-content: flex-start; }
  .navbtn.add span { display: inline; }
  .navbtn.add svg { width: 20px; height: 20px; }
  .nav .navfilters { display: flex; flex-direction: column; gap: 16px; }
  .lib .chips.cats { display: none; }
  .lib { grid-template-columns: minmax(0,1fr) 420px; }
  .row .thumb { height: 66px; }
  .row .thumb .cover, .row .thumb .cover.sq { width: 44px; }
  .row { grid-template-columns: 44px minmax(0,1fr); }
}
.nf h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 6px; padding: 0 8px; }
.nf .opt2 { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 14px; text-align: left; }

const placeholderFor = c => ({livre:'Titre ou auteur…', film:'Titre du film…', serie:'Titre de la série…', musique:'Album, titre ou artiste…', podcast:'Émission ou épisode…'}[c]);
function detectLink(u) {
  if (/spotify\.com\/(album|track|artist|show|episode)/i.test(u)) { const t = u.match(/spotify\.com\/(\w+)/i)[1].toLowerCase(); return {cat: (t==='show'||t==='episode')?'podcast':'musique', src:'Spotify', subtype:t, title: t==='show'||t==='episode' ? 'Les Pieds sur terre' : 'Discovery', creator: t==='show'||t==='episode' ? 'France Culture' : 'Daft Punk', year: t==='show'||t==='episode'?null:2001}; }
  if (/themoviedb\.org\/tv/i.test(u)) return {cat:'serie', src:'TMDB', title:'The Office', creator:'Ricky Gervais, Stephen Merchant', year:2001};
  if (/themoviedb\.org\/movie|imdb\.com\/title/i.test(u)) return {cat:'film', src: /imdb/i.test(u)?'IMDb → TMDB':'TMDB', title:'Le Goût de la cerise', creator:'Abbas Kiarostami', year:1997};
  if (/openlibrary\.org/i.test(u)) return {cat:'livre', src:'Open Library', title:"L'Étranger", creator:'Albert Camus', year:1942};
  return null;
}
function resultsHTML() {
  const a = S.add, q = a.q.trim();
  if (/^https?:\/\//i.test(q)) {
    const d = detectLink(q);
    if (!d) return `<div class="detected">${ic('link')}Lien non reconnu. Tu peux saisir la fiche à la main ; le lien sera gardé.</div>`;
    const it = {category:d.cat, title:d.title, creator:d.creator, year:d.year};
    return `<div class="detected">${ic('check')}Lien ${esc(d.src)} reconnu · ${CATS[d.cat].label}${d.subtype?' · '+SUBTYPE[d.subtype]:''}</div>
      <div class="results"><button class="res" data-a="pick" data-v="link">
        <div class="thumb">${coverHTML(it)}</div>
        <div><div class="r-title">${esc(d.title)}</div><div class="r-meta">${esc(d.creator)}${d.year?' · '+d.year:''}</div></div>
        <span class="plus">${ic('plus')}</span></button></div>`;
  }
  const all = CATALOG[a.cat] || [];
  const hits = q ? all.filter(r => (r.title+' '+r.creator).toLowerCase().includes(q.toLowerCase())) : [];
  const shown = hits.length ? hits : all;
  const label = !q ? 'Exemples de résultats' : hits.length ? `${hits.length} résultat${hits.length>1?'s':''} · ${CATS[a.cat].src}` : `Aucun résultat pour « ${esc(q)} » dans la maquette · exemples`;
  return `<div class="reshead"><span>${label}</span>${a.cat==='musique'||a.cat==='podcast' ? '<span>10 max (limite Spotify)</span>' : ''}</div>
    <div class="results">${shown.map((r,i) => { const it = {category:a.cat, ...r}; return `
      <button class="res" data-a="pick" data-v="${i}" data-hits="${hits.length?1:0}">
        <div class="thumb">${coverHTML(it)}</div>
        <div><div class="r-title">${esc(r.title)}</div><div class="r-meta">${r.subtype?SUBTYPE[r.subtype]+' · ':''}${esc(r.creator)}${r.year?' · '+r.year:''}</div></div>
        <span class="plus">${ic('plus')}</span></button>`; }).join('')}</div>`;
}

      <section class="card"><h2>${ic('download')}Sauvegarde</h2>
        <p class="lead">Chaque modification est déjà un commit sur GitHub. Ici, une copie manuelle du fichier.</p>
        <div class="btnrow"><button class="btn small" data-a="toast" data-v="Export : data.json (14 fiches, 4 tags)">${ic('download')}Exporter data.json</button><button class="btn small" data-a="toast" data-v="Import : choisis un fichier data.json">${ic('upload')}Importer</button></div>
      </section>
      <p class="small" style="text-align:center">Culture v0.1 · thème automatique (clair / sombre selon le téléphone)</p>
    </div>
  </div></div>`;
}

function setupHTML() {
  return `<div class="setup"><div class="setupin">
    <div class="big">Cult<em>ure</em></div>
    <p class="intro">Tes livres, films, séries, musiques et podcasts à découvrir, synchronisés entre ton téléphone et ton ordinateur.</p>
    <div class="card">
      <h2>${ic('key')}Connexion à tes données</h2>
      <p class="lead">Une seule fois par appareil. Rien n'est envoyé ailleurs que chez GitHub.</p>
      <div class="field"><label for="u-tok">Jeton GitHub</label><input class="input mono" id="u-tok" type="password" placeholder="github_pat_…" autocomplete="off"></div>
      <div class="fgrid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="u-own">Propriétaire</label><input class="input" id="u-own" value="robaromat"></div><div class="field"><label for="u-repo">Dépôt</label><input class="input" id="u-repo" value="culture-data"></div></div>
      <div class="field"><label for="u-tmdb">Clé TMDB <span style="text-transform:none;letter-spacing:0;font-weight:400">(films et séries, ajoutable plus tard)</span></label><input class="input mono" id="u-tmdb" type="password" placeholder="Optionnel"></div>
      <button class="btn primary block" data-a="setupdone">Se connecter</button>
    </div>
    <div class="steps">
      <div class="step"><span>Sur github.com : Settings → Developer settings → Fine-grained tokens → Generate new token.</span></div>
      <div class="step"><span>Accès au seul dépôt <b>culture-data</b>, permission <b>Contents : Read and write</b>, avec une date d'expiration.</span></div>
      <div class="step"><span>Colle le jeton ci-dessus. Il reste stocké sur cet appareil uniquement.</span></div>
    </div>
  </div></div>`;
}

function sheetHTML() {
  if (!S.sheet) return '';
  let body = '';
  if (S.sheet === 'status') {
    const cat = S.cat==='all' ? null : S.cat;
    body = `<h2>Statut</h2>` + ['all', ...STATUSES].map(s => `<button class="opt" data-a="setfilterstatus" data-v="${s}">${s==='all'?'Tous les statuts':esc(statusLabel(s, cat))}${S.status===s?`<span class="ck">${ic('check')}</span>`:''}</button>`).join('');
  } else if (S.sheet === 'sort') {
    body = `<h2>Trier par</h2>` + Object.entries(SORTS).map(([k,l]) => `<button class="opt" data-a="setsort" data-v="${k}">${l}${S.sort===k?`<span class="ck">${ic('check')}</span>`:''}</button>`).join('');
  } else if (S.sheet === 'tags') {
    body = `<h2>Tags</h2><p class="small" style="margin:-4px 0 6px">Les fiches doivent avoir tous les tags cochés.</p>` + S.tags.map(t => `<button class="opt" data-a="tagsel" data-v="${t.id}"><span class="tag" style="--tc:${t.color}">${esc(t.name)}</span><span class="small">${tagCount(t.id)}</span>${S.tagsSel.includes(t.id)?`<span class="ck">${ic('check')}</span>`:''}</button>`).join('')
      + `<div class="btnrow" style="margin-top:12px"><button class="btn small primary" data-a="closesheet">Voir les fiches</button>${S.tagsSel.length?'<button class="btn small ghost" data-a="cleartags">Tout décocher</button>':''}</div>`;
  }
  return `<div class="backdrop" data-a="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
}

function render() {
  const app = document.getElementById('app');
  const scrollers = [...app.querySelectorAll('.listpane, .detailpane, .page')].map(e => [e.className.split(' ')[0], e.scrollTop]);
  if (S.screen === 'setup') { app.innerHTML = setupHTML(); return; }
  const main = {library: libraryHTML, add: addHTML, tags: tagsHTML, settings: settingsHTML}[S.screen]();
  app.innerHTML = `<div class="shell">${navHTML()}<main class="main">${main}</main></div>${sheetHTML()}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
  for (const [cls, top] of scrollers) { const el = app.querySelector('.' + cls); if (el && !S._resetScroll) el.scrollTop = top; }
  S._resetScroll = false;
}

let toastT;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2600); }
function fakeSync() { S.sync = 'pending'; render(); setTimeout(() => { S.sync = 'ok'; render(); }, 1600); }

/* ---------------- Actions ---------------- */
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  const it = itemById(S.selected);
  switch (a) {
    case 'go':
      S.screen = v; S.sheet = null; S.confirmDel = false; S._resetScroll = true;
      if (v === 'add') S.add = {cat: S.cat!=='all' ? S.cat : 'film', q:'', draft:null, editing:null, newTag:null};
      break;
    case 'cat': S.cat = v; break;
    case 'subs': S.subs = !S.subs; break;
    case 'view': S.view = v; break;
    case 'sheet': S.sheet = v; break;
    case 'closesheet': S.sheet = null; break;
    case 'setfilterstatus': S.status = v; S.sheet = null; break;
    case 'setsort': S.sort = v; S.sheet = null; break;
    case 'tagsel': S.tagsSel = S.tagsSel.includes(v) ? S.tagsSel.filter(x => x!==v) : [...S.tagsSel, v]; break;
    case 'cleartags': S.tagsSel = []; break;
    case 'reset': Object.assign(S, {cat:'all', status:'all', tagsSel:[], q:'', subs:false}); break;
    case 'open': S.selected = v; S.detailOpen = true; S.confirmDel = false; break;
    case 'closedetail': S.detailOpen = false; S.confirmDel = false; break;
    case 'setstatus':
      it.status = v; it.updatedAt = new Date().toISOString();
      if (v === 'termine') it.finishedAt = TODAY.toISOString();
      fakeSync(); return;
    case 'openlink': {
      const urls = {spotify:'open.spotify.com/album/…', tmdb:'themoviedb.org/movie/…', openlibrary:'openlibrary.org/works/…', manual: it.link || '(aucun lien)'};
      toast('Ouvrirait ' + urls[it.source.provider]); return; }
    case 'recheck': toast('Disponibilité revérifiée auprès de TMDB / JustWatch'); itemById(v).avail.checkedAt = TODAY.toISOString(); return;
    case 'askdel': S.confirmDel = true; break;
    case 'canceldel': S.confirmDel = false; break;
    case 'del': S.items = S.items.filter(i => i.id !== v); S.selected = filtered()[0]?.id || null; S.detailOpen = false; S.confirmDel = false; toast('Fiche supprimée'); fakeSync(); return;
    case 'edit': {
      const src = itemById(v);
      S.add = {cat: src.category, q:'', draft: JSON.parse(JSON.stringify(src)), editing: v, newTag: null};
      S.screen = 'add'; S._resetScroll = true; break; }
    case 'sync': S.sync = {ok:'pending', pending:'error', error:'ok'}[S.sync]; if (S.sync==='error') { toast('Exemple : conflit ou réseau coupé, nouvel essai automatique'); return; } break;
    case 'toast': toast(v); return;

    case 'addcat': S.add.cat = v; S.add.q = ''; break;
    case 'manual': S.add.draft = {id:null, category:S.add.cat, title:'', creator:'', year:null, status:'a_decouvrir', rating:0, tags:[], notes:'', recommendedBy:'', link: /^https?:/.test(S.add.q)?S.add.q:'', source:{provider:'manual'}}; S._resetScroll = true; break;
    case 'pick': {
      let r, cat = S.add.cat, src;
      if (v === 'link') { const d = detectLink(S.add.q.trim()); r = d; cat = d.cat; src = {provider: d.src==='Spotify'?'spotify':d.src==='Open Library'?'openlibrary':'tmdb', subtype: d.subtype||null}; }
      else {
        const all = CATALOG[cat], q = S.add.q.trim().toLowerCase();
        const hits = q ? all.filter(x => (x.title+' '+x.creator).toLowerCase().includes(q)) : [];
        r = (hits.length ? hits : all)[+v];
        src = {provider: cat==='livre'?'openlibrary':(cat==='musique'||cat==='podcast')?'spotify':'tmdb', subtype: r.subtype||null};
      }
      const draft = {id:null, category:cat, title:r.title, creator:r.creator, year:r.year, status:'a_decouvrir', rating:0, tags:[], notes:'', recommendedBy:'', link: v==='link'?S.add.q.trim():'', source:src};
      if (cat==='film'||cat==='serie') draft.avail = {providers: Math.abs(hash(r.title))%3===0 ? ['netflix'] : Math.abs(hash(r.title))%3===1 ? ['prime'] : [], checkedAt: TODAY.toISOString()};
      S.add.draft = draft; S._resetScroll = true; break; }
    case 'formback':
      if (S.add.editing) { S.screen = 'library'; S.add = {cat:'film', q:'', draft:null, editing:null, newTag:null}; }
      else S.add.draft = null;
      S._resetScroll = true; break;
    case 'drafttag': { const d = S.add.draft; d.tags = d.tags.includes(v) ? d.tags.filter(x => x!==v) : [...d.tags, v]; break; }
    case 'newtag': S.add.newTag = {name:'', color: TAG_COLORS[S.tags.length % TAG_COLORS.length]}; render(); document.getElementById('nt-name')?.focus(); return;
    case 'ntcolor': S.add.newTag.color = v; break;
    case 'ntcancel': S.add.newTag = null; break;
    case 'ntcreate': {
      const nt = S.add.newTag; const name = nt.name.trim();
      if (!name) { document.getElementById('nt-name')?.focus(); return; }
      const t = {id:'t'+(++uid), name, color:nt.color}; S.tags.push(t); S.add.draft.tags.push(t.id); S.add.newTag = null; break; }
    case 'draftstatus': S.add.draft.status = v; break;
    case 'draftrating': S.add.draft.rating = S.add.draft.rating === +v ? 0 : +v; break;
    case 'save': {
      const d = S.add.draft;
      if (!d.title.trim()) { document.getElementById('f-title')?.focus(); toast('Il faut au moins un titre'); return; }
      d.year = d.year ? +d.year || null : null;
      if (S.add.editing) { const i = S.items.findIndex(x => x.id === S.add.editing); S.items[i] = {...S.items[i], ...d, updatedAt: TODAY.toISOString()}; S.selected = d.id; }
      else { d.id = 'i'+(++uid); d.addedAt = new Date().toISOString(); S.items.unshift(d); S.selected = d.id; S.cat = 'all'; S.status = d.status; S.tagsSel = []; S.q = ''; }
      const was = !!S.add.editing;
      S.screen = 'library'; S.detailOpen = false; S.add = {cat:'film', q:'', draft:null, editing:null, newTag:null}; S._resetScroll = true;
      toast(was ? 'Fiche enregistrée' : `Ajouté : ${d.title}`); fakeSync(); return; }

    case 'tagedit': S.tagEdit = S.tagEdit === v ? null : v; S.tagConfirm = null; S.mergeTo = ''; break;
    case 'tagcolor': tagById(el.dataset.t).color = v; fakeSync(); return;
    case 'merge': {
      const to = S.mergeTo; if (!to) { toast('Choisis le tag de destination'); return; }
      const from = tagById(v), dest = tagById(to);
      S.items.forEach(i => { if (i.tags.includes(v)) i.tags = [...new Set(i.tags.map(x => x===v ? to : x))]; });
      S.tags = S.tags.filter(t => t.id !== v); S.tagsSel = S.tagsSel.filter(x => x!==v); S.tagEdit = to; S.mergeTo = '';
      toast(`« ${from.name} » fusionné dans « ${dest.name} »`); fakeSync(); return; }
    case 'tagaskdel': S.tagConfirm = v; break;
    case 'tagdelcancel': S.tagConfirm = null; break;
    case 'tagdel': { const t = tagById(v); S.items.forEach(i => i.tags = i.tags.filter(x => x!==v)); S.tags = S.tags.filter(x => x.id!==v); S.tagsSel = S.tagsSel.filter(x => x!==v); S.tagEdit = null; S.tagConfirm = null; toast(`Tag « ${t.name} » supprimé`); fakeSync(); return; }

    case 'prov': S.settings.providers[v] = !S.settings.providers[v]; break;
    case 'test': S.settings[v] = 'wait'; render(); setTimeout(() => { S.settings[v] = 'ok'; render(); }, 900); return;
    case 'setupdone': document.getElementById('p-screen').value = 'app'; S.screen = 'library'; S._resetScroll = true; toast('Connecté · 14 fiches chargées'); return;
  }
  render();
});

document.getElementById('app').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; document.getElementById('listzone').innerHTML = listZoneHTML(filtered()); return; }
  if (t.id === 'addq') {
    S.add.q = t.value;
    const d = /^https?:\/\//i.test(t.value.trim()) && detectLink(t.value.trim());
    if (d && d.cat !== S.add.cat) { S.add.cat = d.cat; render(); const el = document.getElementById('addq'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); return; }
    document.getElementById('results').innerHTML = resultsHTML(); return;
  }
  if (t.id === 'nt-name') { S.add.newTag.name = t.value; return; }
  if (t.dataset.f) { S.add.draft[t.dataset.f] = t.value; return; }
  if (t.dataset.tagname) { tagById(t.dataset.tagname).name = t.value; return; }
});
document.getElementById('app').addEventListener('change', e => {
  if (e.target.matches('[data-merge]')) S.mergeTo = e.target.value;
  if (e.target.dataset.tagname) fakeSync();
});
document.getElementById('app').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'nt-name') { e.preventDefault(); document.querySelector('[data-a="ntcreate"]').click(); }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
});

/* ---------------- Barre de maquette ---------------- */
const FORMATS = {auto:null, closed:[344, 860], open:[690, 820], desk:[1280, 800]};
function applyFormat(v) {
  const stage = document.getElementById('stage'), dev = document.getElementById('device');
  const f = FORMATS[v];
  stage.classList.toggle('framed', !!f);
  if (f) { dev.style.setProperty('--w', f[0]+'px'); dev.style.setProperty('--h', f[1]+'px'); }
  if (v === 'closed') S.detailOpen = false;
  render();
}
document.getElementById('p-format').addEventListener('change', e => applyFormat(e.target.value));
document.getElementById('p-theme').addEventListener('change', e => {
  const v = e.target.value;
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
});
document.getElementById('p-screen').addEventListener('change', e => { S.screen = e.target.value === 'setup' ? 'setup' : 'library'; S._resetScroll = true; render(); });

render();
})();
</script>
